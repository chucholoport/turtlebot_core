# =====================================================================
#  robot.ini  ·  configuracion de TU robot
# ---------------------------------------------------------------------
#  Edita SOLO este archivo. Le dice al launch que plataforma usas y que
#  dispositivos tienes REALMENTE conectados. No necesitas tocar ningun
#  archivo .launch.py.
#
#  Lo consume:  ros2 launch turtlebot_core edge.launch.py
#
#  Si compilaste con  colcon build --symlink-install  los cambios de
#  este archivo se toman sin reconstruir. Si no, reconstruye tras editar.
# =====================================================================

[platform]
# Donde corres la adquisicion:
#   sbc  -> en la SBC del robot: el edge solo capta; RViz corre aparte en tu PC
#   host -> pruebas en tu PC: conectas la webcam y la ESP32 a los puertos del PC
#           y host.launch.py levanta RViz + la captura (todo local, un comando)
target = sbc

# Como se habla con el chassis del robot (elige tu placa):
#   microros -> ESP32 / ESP-IDF 5.4   (micro-ROS agent)
#   uno_q    -> Arduino Uno Q          (uno_q_bridge, socket UNIX)
backend = microros

# Variante flasheada: "led" (solo LED) o "chassis" (ruedas). El nombre es
# homonimo al firmware/proyecto. Aplica a ambas placas y elige entre DOS
# artefactos de firmware separados:
#   uno_q -> elige el NODO ROS que se levanta:
#              led     -> sketch led.ino      -> nodo uno_q_bridge
#              chassis -> sketch chassis.ino  -> nodo chassis_bridge
#   esp32 -> debe coincidir con el PROYECTO que flasheaste (no cambia el agente):
#              led     -> proyecto esp32_ws/led
#              chassis -> proyecto esp32_ws/chassis
#            Ponlo igual que el firmware flasheado; el launch te lo recuerda.
firmware = led

[devices]
# Que tienes conectado en TU robot ahora mismo:  true / false
# El launch levanta unicamente lo que marques en true.
rplidar = true
webcam  = true
chassis = true

[rplidar]
serial_port     = /dev/rplidar
serial_baudrate = 115200          # A1/A2 = 115200, A3 = 256000
frame_id        = laser

[webcam]
video_device = /dev/video0        # o /dev/v4l/by-id/...-video-index0
pixel_format = yuyv               # yuyv | mjpeg2rgb (segun tu camara)
image_width  = 640
image_height = 480
framerate    = 30.0
parent_frame = laser              # frame padre del TF; con solo rplidar usa 'laser'

[microros]
# Solo aplica si  backend = microros
transport       = serial          # serial | udp4
serial_device   = /dev/ttyUSB0
serial_baudrate = 115200          # debe coincidir con el firmware de la ESP32
udp_port        = 8888
